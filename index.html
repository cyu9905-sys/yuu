<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Collection Avatar Simulation</title>
    <style>
        body { margin: 0; font-family: 'Pretendard', sans-serif; background: #f0f2f5; }
        .main-container { display: flex; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* 왼쪽 아바타 영역 */
        .avatar-display { flex: 2; background: #fff; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #main-avatar-frame { min-height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fafafa; border-radius: 15px; }
        #current-avatar { width: 100%; max-width: 500px; border-radius: 10px; transition: opacity 0.3s ease; }
        
        /* 오른쪽 스타일 리스트 영역 */
        .style-sidebar { flex: 1; background: #fff; padding: 20px; border-radius: 20px; height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .style-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        .style-item { border: 2px solid #eee; border-radius: 15px; cursor: pointer; transition: 0.3s; overflow: hidden; }
        .style-item:hover { border-color: #4a90e2; transform: translateY(-3px); }
        .style-item.active { border-color: #4a90e2; background: #f0f7ff; }
        
        .style-item img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .style-item span { display: block; font-size: 15px; font-weight: 600; padding: 12px; text-align: center; }

        .apply-btn { margin-top: 25px; padding: 18px 80px; background: #4a90e2; color: white; border: none; border-radius: 35px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .apply-btn:hover { background: #357abd; box-shadow: 0 5px 15px rgba(74,144,226,0.4); }
        .label { margin-top: 15px; color: #bbb; font-weight: bold; font-size: 12px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="avatar-display">
        <div id="main-avatar-frame">
            <img id="current-avatar" src="style1.jpg" alt="Main Avatar" onerror="this.src='https://via.placeholder.com/500x700?text=G-Collection+Avatar'">
            <p class="label">MAIN VIEW</p>
        </div>
        <button class="apply-btn" onclick="applySelection()">최종 적용하기</button>
    </div>

    <div class="style-sidebar">
        <h3 style="margin-bottom:20px; color:#333;">스타일 추천 (8)</h3>
        <div id="style-grid" class="style-grid">
            </div>
    </div>
</div>

<script src="새로운 1.js"></script>
</body>
</html>
