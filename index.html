
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제니 AI 옷입히기 - 드래그 앤 드롭</title>
    <style>
        body { background-color: #fff0f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif; }
        .game-wrapper { width: 800px; height: 600px; display: flex; background: white; border-radius: 30px; padding: 20px; box-shadow: 0 20px 50px rgba(255,105,180,0.3); border: 5px solid #ffb6c1; }
        
        /* 왼쪽: 캐릭터 배치 영역 */
        .drop-zone { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #fff5f7; border-radius: 20px; border: 3px dashed #ffc0cb; transition: 0.3s; }
        .drop-zone.drag-over { background: #ffe4e1; border-color: #ff69b4; transform: scale(1.02); }
        #mainAvatar { height: 90%; border-radius: 15px; pointer-events: none; }
        .drop-label { position: absolute; bottom: 10px; color: #ff69b4; font-weight: bold; }

        /* 오른쪽: 옷장(드래그할 아이템들) */
        .closet { width: 300px; padding-left: 20px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 15px; }
        .drag-item { border: 2px solid #eee; border-radius: 15px; cursor: grab; overflow: hidden; display: flex; flex-direction: column; align-items: center; background: #fff; transition: 0.2s; }
        .drag-item:active { cursor: grabbing; opacity: 0.7; }
        .drag-item:hover { border-color: #ff69b4; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .drag-item img { width: 100%; height: 80%; object-fit: cover; }
        .drag-item span { font-size: 12px; padding: 5px; color: #666; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="drop-zone" id="dropZone" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
        <img id="mainAvatar" src="EF411M.jpg" alt="Jenny">
        <div class="drop-label">여기에 옷을 끌어다 놓으세요!</div>
    </div>

    <div class="closet">
        <div class="drag-item" draggable="true" ondragstart="drag(event)" data-img="EF259M.jpg">
            <img src="EF259M.jpg"><span>캐주얼</span>
        </div>
        <div class="drag-item" draggable="true" ondragstart="drag(event)" data-img="EF300M.jpg">
            <img src="EF300M.jpg"><span>오피스 룩</span>
        </div>
        <div class="drag-item" draggable="true" ondragstart="drag(event)" data-img="EF330M.jpg">
            <img src="EF330M.jpg"><span>이브닝 드레스</span>
        </div>
        <div class="drag-item" draggable="true" ondragstart="drag(event)" data-img="EF350M.jpg">
            <img src="EF350M.jpg"><span>액티브웨어</span>
        </div>
        <div class="drag-item" draggable="true" ondragstart="drag(event)" data-img="EF358M.jpg">
            <img src="EF358M.jpg"><span>프레피 룩</span>
        </div>
        <div class="drag-item" draggable="true" ondragstart="drag(event)" data-img="EF369M.jpg">
            <img src="EF369M.jpg"><span>윈터 레이어드</span>
        </div>
    </div>
</div>

<script>
    function allowDrop(ev) {
        ev.preventDefault();
        document.getElementById('dropZone').classList.add('drag-over');
    }

    function dragLeave(ev) {
        document.getElementById('dropZone').classList.remove('drag-over');
    }

    function drag(ev) {
        ev.dataTransfer.setData("newImg", ev.currentTarget.getAttribute('data-img'));
    }

    function drop(ev) {
        ev.preventDefault();
        document.getElementById('dropZone').classList.remove('drag-over');
        
        const newImgUrl = ev.dataTransfer.getData("newImg");
        const avatar = document.getElementById('mainAvatar');
        
        avatar.style.transition = "0.3s";
        avatar.style.opacity = "0";
        
        setTimeout(() => {
            avatar.src = newImgUrl;
            avatar.style.opacity = "1";
        }, 300);
    }
</script>

</body>
</html>
