<div class="main-container">
    <div class="avatar-display">
        <div id="main-avatar-frame">
            <img id="current-avatar" src="avatar_base.jpg" alt="Main Avatar">
            <p class="label">MAIN VIEW</p>
        </div>
        <button class="apply-btn">최종 적용하기</button>
    </div>

    <div class="style-sidebar">
        <h3>스타일 추천 (8)</h3>
        <div class="style-grid">
            <div class="style-item" onclick="changeStyle('style1.jpg')">
                <img src="style1_thumb.jpg">
                <span>미니멀</span>
            </div>
            <div class="style-item" onclick="changeStyle('style2.jpg')">
                <img src="style2_thumb.jpg">
                <span>어반</span>
            </div>
            </div>
    </div>
</div>

<style>
.main-container { display: flex; gap: 20px; padding: 20px; background: #f5f5f5; }
.avatar-display { flex: 2; text-align: center; background: #fff; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
#main-avatar-frame img { width: 100%; max-width: 500px; border-radius: 10px; }

.style-sidebar { flex: 1; background: #fff; padding: 15px; border-radius: 15px; height: 80vh; overflow-y: auto; }
.style-grid { display: grid; grid-template-columns: 1 white 1fr; gap: 10px; }
.style-item { border: 2px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.2s; overflow: hidden; position: relative; }
.style-item:hover { border-color: #007bff; }
.style-item img { width: 100%; height: 120px; object-fit: cover; display: block; }
.style-item span { display: block; font-size: 12px; padding: 5px; background: rgba(255,255,255,0.8); text-align: center; }

.apply-btn { margin-top: 20px; padding: 12px 40px; background: #4a90e2; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
</style>
